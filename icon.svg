<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#07090e"/>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(245, 158, 11, 0.3)" stroke-width="2"/>

  <!-- Roman Temple / Aerarium Structure -->
  <g transform="translate(64, 76)">
    <!-- Pediment Roof (Triangle) -->
    <polygon points="192,20 30,110 354,110" fill="url(#goldGrad)"/>
    <polygon points="192,45 65,100 319,100" fill="#0b0f17"/>
    
    <!-- Temple Architrave / Beam -->
    <rect x="20" y="116" width="344" height="26" rx="4" fill="url(#goldGrad)"/>
    
    <!-- 4 Roman Pillars -->
    <!-- Pillar 1 -->
    <rect x="42" y="148" width="30" height="175" rx="3" fill="url(#emeraldGrad)"/>
    <rect x="36" y="142" width="42" height="10" rx="2" fill="url(#goldGrad)"/>
    <rect x="36" y="318" width="42" height="12" rx="2" fill="url(#goldGrad)"/>

    <!-- Pillar 2 -->
    <rect x="126" y="148" width="30" height="175" rx="3" fill="url(#emeraldGrad)"/>
    <rect x="120" y="142" width="42" height="10" rx="2" fill="url(#goldGrad)"/>
    <rect x="120" y="318" width="42" height="12" rx="2" fill="url(#goldGrad)"/>

    <!-- Pillar 3 -->
    <rect x="228" y="148" width="30" height="175" rx="3" fill="url(#emeraldGrad)"/>
    <rect x="222" y="142" width="42" height="10" rx="2" fill="url(#goldGrad)"/>
    <rect x="222" y="318" width="42" height="12" rx="2" fill="url(#goldGrad)"/>

    <!-- Pillar 4 -->
    <rect x="312" y="148" width="30" height="175" rx="3" fill="url(#emeraldGrad)"/>
    <rect x="306" y="142" width="42" height="10" rx="2" fill="url(#goldGrad)"/>
    <rect x="306" y="318" width="42" height="12" rx="2" fill="url(#goldGrad)"/>

    <!-- Base / Stylobate Steps -->
    <rect x="16" y="332" width="352" height="20" rx="4" fill="url(#goldGrad)"/>
    <rect x="0" y="352" width="384" height="24" rx="6" fill="#1f2937"/>
  </g>
</svg>
